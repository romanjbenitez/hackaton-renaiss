services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: proptech
      POSTGRES_PASSWORD: proptech_dev
      POSTGRES_DB: proptech_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proptech -d proptech_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://proptech:proptech_dev@db:5432/proptech_db
      DIRECT_URL: postgresql://proptech:proptech_dev@db:5432/proptech_db
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.x.ai/v1}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrate
    command: >
      sh -c "npx prisma migrate deploy && npx prisma db seed"
    environment:
      DATABASE_URL: postgresql://proptech:proptech_dev@db:5432/proptech_db
      DIRECT_URL: postgresql://proptech:proptech_dev@db:5432/proptech_db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data:
